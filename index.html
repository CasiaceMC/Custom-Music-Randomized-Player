<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlight Randomized Music Player</title>
    <style>
        :root {
            --bg-moon: #08070b;
            --surface-dark: #121017;
            --surface-card: #181521;
            --border-color: #272235;
            --accent-purple: #b892ff;
            --accent-purple-glow: rgba(184, 146, 255, 0.15);
            --text-main: #f0edff;
            --text-muted: #8b83a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-moon);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Minimal subtle shadow requested */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Top Bar Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--surface-card);
            border-bottom: 1px solid var(--border-color);
        }

        .folder-display {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--accent-purple);
        }

        .folder-display svg {
            width: 18px;
            height: 18px;
            fill: var(--accent-purple);
        }

        .folder-actions {
            display: flex;
            gap: 8px;
        }

        /* Minimal Buttons */
        .btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            border-color: var(--accent-purple);
            background-color: var(--accent-purple-glow);
            color: var(--accent-purple);
        }

        .btn-primary {
            background-color: var(--accent-purple);
            color: var(--bg-moon);
            border-color: var(--accent-purple);
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #a47af4;
            color: var(--bg-moon);
        }

        /* Music List View Area */
        .playlist-section {
            padding: 20px;
            max-height: 320px;
            overflow-y: auto;
        }

        .playlist-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .track-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .track-item:hover {
            border-color: rgba(184, 146, 255, 0.4);
            background-color: rgba(184, 146, 255, 0.03);
        }

        .track-item.active {
            border-color: var(--accent-purple);
            background-color: var(--accent-purple-glow);
            color: var(--accent-purple);
        }

        .track-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 420px;
        }

        .track-index {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Active Player Footer Controls */
        .player-footer {
            padding: 16px 20px;
            background-color: var(--surface-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .now-playing-info {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-info span {
            color: var(--text-main);
            font-weight: 500;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-purple);
            border-radius: 2px;
            width: 0%;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playback-btns {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: var(--accent-purple);
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .control-btn.main-play {
            background-color: var(--accent-purple);
            color: var(--bg-moon);
            border-radius: 50%;
            padding: 8px;
        }
        
        .control-btn.main-play:hover {
            background-color: #a47af4;
            color: var(--bg-moon);
        }

        .status-badge {
            font-size: 11px;
            background: rgba(184, 146, 255, 0.1);
            color: var(--accent-purple);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(184, 146, 255, 0.2);
        }

        /* Scrollbar aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--surface-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Top Bar: Folder Name (Left) & Folder Pickers (Right) -->
        <div class="top-bar">
            <div class="folder-display">
                <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                <span id="folderNameText">No folder selected</span>
            </div>
            <div class="folder-actions">
                <!-- Hidden inputs for picking files/folders -->
                <input type="file" id="folderPicker" webkitdirectory directory multiple style="display: none;">
                <input type="file" id="filePicker" accept="audio/mp3,audio/*" multiple style="display: none;">
                
                <button class="btn btn-primary" onclick="document.getElementById('folderPicker').click()">Select Folder</button>
                <button class="btn" onclick="document.getElementById('filePicker').click()">Add Files</button>
            </div>
        </div>

        <!-- Randomized Music List Container -->
        <div class="playlist-section">
            <div class="playlist-title">Randomized Playlist Queue</div>
            <div id="playlistContainer">
                <div class="empty-state">
                    There is no music in the music file list.<br>Please select a folder or files to begin.
                </div>
            </div>
        </div>

        <!-- Active Music Player Footer Panel -->
        <div class="player-footer">
            <div class="now-playing-info">
                Now Playing: <span id="currentTrackTitle">None</span>
            </div>
            
            <div class="progress-container" id="progressContainer" onclick="seekTrack(event)">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="controls-row">
                <div class="playback-btns">
                    <button class="control-btn" onclick="playPrevious()" title="Previous Track">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="control-btn main-play" id="playPauseBtn" onclick="togglePlayPause()" title="Play / Pause">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="control-btn" onclick="playNextRandom()" title="Next Random Track">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
                <div class="status-badge" id="shuffleStatus">True Random Mode</div>
            </div>
        </div>
    </div>

    <!-- Hidden native audio element -->
    <audio id="audioElement"></audio>

    <script>
        let masterTracks = [];     // Original loaded list
        let randomizedQueue = [];  // Truly randomized index queue
        let currentQueueIndex = 0; // Current index within the randomized queue
        let isPlaying = false;

        const audioElement = document.getElementById('audioElement');
        const folderNameText = document.getElementById('folderNameText');
        const playlistContainer = document.getElementById('playlistContainer');
        const currentTrackTitle = document.getElementById('currentTrackTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');

        // Event listeners for file / folder inputs
        document.getElementById('folderPicker').addEventListener('change', handleFolderSelection);
        document.getElementById('filePicker').addEventListener('change', handleFileSelection);

        function handleFolderSelection(event) {
            const files = Array.from(event.target.files).filter(file => file.type.startsWith('audio/') || file.name.endsWith('.mp3'));
            if (files.length > 0) {
                // Extract folder name from the first file's relative path if possible
                const firstPath = files[0].webkitRelativePath;
                const folderName = firstPath ? firstPath.split('/')[0] : 'Selected Folder';
                folderNameText.textContent = folderName;
                loadTracks(files);
            } else {
                showEmptyState();
            }
        }

        function handleFileSelection(event) {
            const files = Array.from(event.target.files).filter(file => file.type.startsWith('audio/') || file.name.endsWith('.mp3'));
            if (files.length > 0) {
                folderNameText.textContent = "Custom Files List";
                loadTracks(files);
            } else {
                showEmptyState();
            }
        }

        function loadTracks(files) {
            masterTracks = files.map(file => ({
                name: file.name.replace(/\.[^/.]+$/, ""), // Strip extension for clean display
                file: file,
                url: URL.createObjectURL(file)
            }));

            generateTrulyRandomizedQueue();
            renderPlaylist();
            
            // Automatically play the first track in the randomized sequence
            if (randomizedQueue.length > 0) {
                currentQueueIndex = 0;
                playTrackFromQueue(currentQueueIndex);
            }
        }

        // Fisher-Yates Shuffle Algorithm for a truly randomized sequence
        function generateTrulyRandomizedQueue() {
            let indices = masterTracks.map((_, index) => index);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            randomizedQueue = indices;
        }

        function showEmptyState() {
            masterTracks = [];
            randomizedQueue = [];
            folderNameText.textContent = "No folder selected";
            playlistContainer.innerHTML = `
                <div class="empty-state">
                    There is no music in the music file list.<br>Please select a folder or files to begin.
                </div>
            `;
            currentTrackTitle.textContent = "None";
            audioElement.pause();
            audioElement.src = "";
        }

        function renderPlaylist() {
            if (masterTracks.length === 0) {
                showEmptyState();
                return;
            }

            let html = '<ul class="track-list">';
            // We display tracks in their randomized playback sequence order to match player behavior
            randomizedQueue.forEach((trackIndex, qIndex) => {
                const track = masterTracks[trackIndex];
                const isActive = (qIndex === currentQueueIndex && isPlaying);
                html += `
                    <li class="track-item ${isActive ? 'active' : ''}" onclick="onTrackItemClick(${qIndex})">
                        <span class="track-name">${track.name}</span>
                        <span class="track-index">#${qIndex + 1}</span>
                    </li>
                `;
            });
            html += '</ul>';
            playlistContainer.innerHTML = html;
        }

        function onTrackItemClick(queueIndex) {
            currentQueueIndex = queueIndex;
            playTrackFromQueue(currentQueueIndex);
        }

        function playTrackFromQueue(queueIndex) {
            if (randomizedQueue.length === 0) return;
            
            currentQueueIndex = queueIndex;
            const masterIdx = randomizedQueue[currentQueueIndex];
            const track = masterTracks[masterIdx];

            audioElement.src = track.url;
            audioElement.play()
                .then(() => {
                    isPlaying = true;
                    updatePlayButtonState();
                    currentTrackTitle.textContent = track.name;
                    renderPlaylist(); // Refresh highlight UI
                })
                .catch(err => {
                    console.error("Playback error:", err);
                });
        }

        function togglePlayPause() {
            if (masterTracks.length === 0) return;

            if (audioElement.paused) {
                if (!audioElement.src) {
                    playTrackFromQueue(currentQueueIndex);
                } else {
                    audioElement.play();
                    isPlaying = true;
                }
            } else {
                audioElement.pause();
                isPlaying = false;
            }
            updatePlayButtonState();
            renderPlaylist();
        }

        function updatePlayButtonState() {
            if (isPlaying && !audioElement.paused) {
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pause icon
            } else {
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play icon
            }
        }

        function playNextRandom() {
            if (randomizedQueue.length === 0) return;

            currentQueueIndex++;
            // If we finish the randomized playlist cycle, reshuffle a new random sequence for true infinite randomness
            if (currentQueueIndex >= randomizedQueue.length) {
                generateTrulyRandomizedQueue();
                currentQueueIndex = 0;
            }
            playTrackFromQueue(currentQueueIndex);
        }

        function playPrevious() {
            if (randomizedQueue.length === 0) return;
            
            currentQueueIndex--;
            if (currentQueueIndex < 0) {
                currentQueueIndex = randomizedQueue.length - 1;
            }
            playTrackFromQueue(currentQueueIndex);
        }

        // Automatically trigger the next randomized song when the current one finishes
        audioElement.addEventListener('ended', () => {
            playNextRandom();
        });

        // Update progress bar tracking
        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                progressBar.style.width = progressPercent + '%';
            }
        });

        function seekTrack(event) {
            if (!audioElement.duration) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const width = rect.width;
            audioElement.currentTime = (clickX / width) * audioElement.duration;
        }
    </script>
</body>
  </html>
