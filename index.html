<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moonlight Randomized Music Player</title>
    <style>
        :root {
            --bg-moon: #08070b;
            --surface-dark: #121017;
            --surface-card: #181521;
            --border-color: #272235;
            --accent-purple: #b892ff;
            --accent-purple-glow: rgba(184, 146, 255, 0.15);
            --text-main: #f0edff;
            --text-muted: #8b83a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg-moon);
            color: var(--text-main);
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .player-container {
            width: 100%;
            height: 100%;
            background-color: var(--bg-moon);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Bar Header */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 24px;
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .folder-actions {
            display: flex;
            gap: 8px;
        }

        /* Minimal Buttons */
        .btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            border-color: var(--accent-purple);
            background-color: var(--accent-purple-glow);
            color: var(--accent-purple);
        }

        .btn-primary {
            background-color: var(--accent-purple);
            color: var(--bg-moon);
            border-color: var(--accent-purple);
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #a47af4;
            color: var(--bg-moon);
        }

        /* Music List View Area */
        .playlist-section {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .playlist-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .track-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .track-item:hover {
            border-color: rgba(184, 146, 255, 0.4);
            background-color: rgba(184, 146, 255, 0.03);
        }

        .track-item.active {
            border-color: var(--accent-purple);
            background-color: var(--accent-purple-glow);
            color: var(--accent-purple);
        }

        .track-main-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Bottom Panel: Only file name being played & track line */
        .player-footer {
            padding: 14px 24px;
            background-color: var(--surface-dark);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .now-playing-info {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .now-playing-info span {
            color: var(--accent-purple);
            font-weight: 500;
        }

        .progress-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            height: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-purple);
            border-radius: 2px;
            width: 0%;
        }

        /* Loading Screen Overlay */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(8, 7, 11, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #loadingOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 14px;
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Clean scrollbar styling */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-moon);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- Loading Screen Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingMessage">Reading music files...</div>
    </div>

    <div class="player-container">
        <!-- Top Bar: Folder Picker on right -->
        <div class="top-bar">
            <div class="folder-actions">
                <input type="file" id="folderPicker" webkitdirectory directory multiple style="display: none;">
                <button class="btn btn-primary" onclick="document.getElementById('folderPicker').click()">Select Folder</button>
            </div>
        </div>

        <!-- Randomized Music List Container -->
        <div class="playlist-section">
            <div class="playlist-title" id="playlistTitleText">No Folder Selected Playlist</div>
            <div id="playlistContainer">
                <div class="empty-state">
                    There is no music in the music file list.<br>Please select a folder to begin.
                </div>
            </div>
        </div>

        <!-- Bottom Panel: File Name & Track Line Only -->
        <div class="player-footer">
            <div class="now-playing-info">
                Playing: <span id="currentTrackTitle">None</span>
            </div>
            <div class="progress-container" id="progressContainer" onclick="seekTrack(event)">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <!-- Hidden native audio element -->
    <audio id="audioElement"></audio>

    <script>
        let masterTracks = [];     
        let randomizedQueue = [];  
        let currentQueueIndex = 0; 
        let isPlaying = false;
        let currentFolderName = "No Folder Selected";

        const audioElement = document.getElementById('audioElement');
        const playlistTitleText = document.getElementById('playlistTitleText');
        const playlistContainer = document.getElementById('playlistContainer');
        const currentTrackTitle = document.getElementById('currentTrackTitle');
        const progressBar = document.getElementById('progressBar');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingMessage = document.getElementById('loadingMessage');

        function showLoading(msg = "Reading music files...") {
            loadingMessage.textContent = msg;
            loadingOverlay.classList.add('active');
        }

        function hideLoading() {
            loadingOverlay.classList.remove('active');
        }

        document.getElementById('folderPicker').addEventListener('change', handleFolderSelection);

        // Auto-load saved tracks from IndexedDB storage on startup with loading overlay
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                showLoading("Restoring saved playlist...");
                const savedData = await loadFromIndexedDB();
                if (savedData && savedData.tracks && savedData.tracks.length > 0) {
                    currentFolderName = savedData.folderName || "Stored Playlist";
                    playlistTitleText.textContent = `${currentFolderName} Playlist`;
                    
                    masterTracks = savedData.tracks.map(t => ({
                        name: t.name,
                        url: URL.createObjectURL(t.blob)
                    }));

                    generateTrulyRandomizedQueue();
                    renderPlaylist();
                }
            } catch (err) {
                console.log("No previously stored tracks found.", err);
            } finally {
                hideLoading();
            }
        });

        async function handleFolderSelection(event) {
            const fileList = Array.from(event.target.files).filter(file => file.type.startsWith('audio/') || file.name.endsWith('.mp3'));
            if (fileList.length > 0) {
                showLoading("Processing and saving files...");
                
                // Yield execution frame briefly so UI renders loading screen smoothly
                await new Promise(resolve => setTimeout(resolve, 50));

                const firstPath = fileList[0].webkitRelativePath;
                currentFolderName = firstPath ? firstPath.split('/')[0] : 'Selected Folder';
                playlistTitleText.textContent = `${currentFolderName} Playlist`;

                let storageTracks = [];
                masterTracks = fileList.map(file => {
                    storageTracks.push({ name: file.name.replace(/\.[^/.]+$/, ""), blob: file });
                    return {
                        name: file.name.replace(/\.[^/.]+$/, ""),
                        url: URL.createObjectURL(file)
                    };
                });

                await saveToIndexedDB({
                    folderName: currentFolderName,
                    tracks: storageTracks
                });

                generateTrulyRandomizedQueue();
                renderPlaylist();
                
                if (randomizedQueue.length > 0) {
                    currentQueueIndex = 0;
                    playTrackFromQueue(currentQueueIndex);
                }
                hideLoading();
            } else {
                showEmptyState();
            }
        }

        function generateTrulyRandomizedQueue() {
            let indices = masterTracks.map((_, index) => index);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            randomizedQueue = indices;
        }

        function showEmptyState() {
            masterTracks = [];
            randomizedQueue = [];
            currentFolderName = "No Folder Selected";
            playlistTitleText.textContent = "No Folder Selected Playlist";
            playlistContainer.innerHTML = `
                <div class="empty-state">
                    There is no music in the music file list.<br>Please select a folder to begin.
                </div>
            `;
            currentTrackTitle.textContent = "None";
            audioElement.pause();
            audioElement.src = "";
            progressBar.style.width = '0%';
        }

        function renderPlaylist() {
            if (masterTracks.length === 0) {
                showEmptyState();
                return;
            }

            let html = '<ul class="track-list">';
            randomizedQueue.forEach((trackIndex, qIndex) => {
                const track = masterTracks[trackIndex];
                const isActive = (qIndex === currentQueueIndex && isPlaying);
                html += `
                    <li class="track-item ${isActive ? 'active' : ''}" onclick="onTrackItemClick(${qIndex})">
                        <span class="track-main-title">${track.name}</span>
                    </li>
                `;
            });
            html += '</ul>';
            playlistContainer.innerHTML = html;
        }

        function onTrackItemClick(queueIndex) {
            currentQueueIndex = queueIndex;
            playTrackFromQueue(currentQueueIndex);
        }

        function playTrackFromQueue(queueIndex) {
            if (randomizedQueue.length === 0) return;
            
            currentQueueIndex = queueIndex;
            const masterIdx = randomizedQueue[currentQueueIndex];
            const track = masterTracks[masterIdx];

            audioElement.src = track.url;
            audioElement.play()
                .then(() => {
                    isPlaying = true;
                    currentTrackTitle.textContent = track.name;
                    renderPlaylist(); 
                })
                .catch(err => {
                    console.error("Playback error:", err);
                });
        }

        function playNextRandom() {
            if (randomizedQueue.length === 0) return;

            currentQueueIndex++;
            if (currentQueueIndex >= randomizedQueue.length) {
                generateTrulyRandomizedQueue();
                currentQueueIndex = 0;
            }
            playTrackFromQueue(currentQueueIndex);
        }

        audioElement.addEventListener('ended', () => {
            playNextRandom();
        });

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                progressBar.style.width = progressPercent + '%';
            }
        });

        function seekTrack(event) {
            if (!audioElement.duration) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const width = rect.width;
            audioElement.currentTime = (clickX / width) * audioElement.duration;
        }

        /* IndexedDB True Permanent Local Storage Setup */
        function openStorageDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('MoonlightTrueStorage', 1);
                request.onupgradeneeded = e => {
                    e.target.result.createObjectStore('playlistStore');
                };
                request.onsuccess = e => resolve(e.target.result);
                request.onerror = e => reject(e.target.error);
            });
        }

        async function saveToIndexedDB(data) {
            const db = await openStorageDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('playlistStore', 'readwrite');
                tx.objectStore('playlistStore').put(data, 'cachedPlaylist');
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => reject(tx.error);
            });
        }

        async function loadFromIndexedDB() {
            const db = await openStorageDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('playlistStore', 'readonly');
                const req = tx.objectStore('playlistStore').get('cachedPlaylist');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }
    </script>
</body>
</html>
